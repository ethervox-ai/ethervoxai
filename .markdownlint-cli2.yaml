# Configuration for markdownlint-cli2
# https://github.com/DavidAnson/markdownlint-cli2

# Glob patterns for files to lint
globs:
  - "**/*.md"

# Glob patterns for files to ignore
ignores:
  - "node_modules/**"
  - ".git/**"
  - "**/node_modules/**"
  - "dashboard/node_modules/**"
  - ".gitignore"
  - ".github/**"

# markdownlint configuration object
config:
  # Purely stylistic spacing/length rules are off: they produced ~3,500 findings that hid real
  # problems. Correctness rules (broken links, heading structure, fences) stay on.
  MD013: false
  MD022: false
  MD031: false
  MD032: false
  MD040: false
  MD060: false

  # MD033: Inline HTML
  MD033:
    allowed_elements:
      - "br"
      - "details" 
      - "summary"
      - "img"
      - "a"
      - "div"
      - "span"
      - "kbd"
  
  # MD041: First line in file should be a top level header
  MD041: false
  
  # MD034: Bare URL used
  MD034: false

  # MD025: Multiple top-level headings in the same document
  MD025: false